
name: Teste Firebase Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar ambiente de teste
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FED_CONSULTANCY }}
          projectId: fed-consultancy
          channelId: fedintelligence-teste
          expires: 7d
  
